[package]
name = "sanshain-rs"
version = "2.0.0"
edition = "2021"
authors = ["Expert Rust Engineer"]
description = "Client library for Sanshain Service 2.x: provide versioned API specs and require pinned endpoint snippets"

[dependencies]
ureq = { version = "2.9", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
cargo_metadata = "0.18"
