[package]
name = "sanshain"
description = "Client library for Sanshain Service 2.x: provide versioned API specs and require pinned endpoint snippets"
readme = "README.md"
keywords = ["openapi", "asyncapi", "grpc", "api", "contract"]
categories = ["development-tools::build-utils", "api-bindings"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ureq = { version = "2.9", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
# preserve_order: unknown sanshain.yaml fields are reported in file order.
serde_json = { version = "1.0", features = ["preserve_order"] }
# The same YAML reader the Sanshain service uses, so client and server agree on
# what a document means rather than agreeing by coincidence.
serde_yaml_ng = "0.10"
thiserror = "1.0"
