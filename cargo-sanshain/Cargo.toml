[package]
name = "cargo-sanshain"
description = "Cargo subcommand for providing and requiring API specs via Sanshain Service 2.x"
readme = "README.md"
keywords = ["openapi", "asyncapi", "grpc", "api", "cargo-subcommand"]
categories = ["development-tools::build-utils", "command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.4", features = ["derive"] }
# Both fields are required: `cargo publish` strips `path` and resolves the
# dependency from the registry by `version`.
sanshain = { version = "2.0.0", path = "../sanshain" }
anyhow = "1.0"
