[package]
name = "cargo-sanshain"
version = "2.0.0"
edition = "2021"
authors = ["Expert Rust Engineer"]
description = "Cargo subcommand for providing and requiring API specs via Sanshain Service 2.x"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
cargo_metadata = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sanshain-rs = { version = "2.0.0", path = "../sanshain-rs" }
thiserror = "1.0"
anyhow = "1.0"
