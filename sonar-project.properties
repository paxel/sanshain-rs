# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_sanshain-rs
# Analysed by the sonar job of .github/workflows/ci.yml (paxel/gates sonar.yml) on pull requests
# and on summer; Automatic Analysis is off in the project's settings.
sonar.organization=paxel
sonar.projectKey=paxel_sanshain-rs
sonar.projectName=sanshain-rs

# The library, the cargo subcommand and the workflows; the integration tests
# are the tests.
sonar.sources=sanshain/src,cargo-sanshain/src,.github
sonar.tests=sanshain/tests,cargo-sanshain/tests
sonar.sourceEncoding=UTF-8

# Coverage: the shared Rust gate measures with tarpaulin and keeps coverage/rust.lcov, which
# the sonar job downloads.
sonar.rust.lcov.reportPaths=coverage/rust.lcov
