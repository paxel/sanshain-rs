# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_sanshain-rs
# Analysed by .github/workflows/sonar.yml on pushes to summer; Automatic
# Analysis is off in the project's settings.
sonar.organization=paxel
sonar.projectKey=paxel_sanshain-rs
sonar.projectName=sanshain-rs

# The library, the cargo subcommand and the workflows; the integration tests
# are the tests.
sonar.sources=sanshain/src,cargo-sanshain/src,.github
sonar.tests=sanshain/tests,cargo-sanshain/tests
sonar.sourceEncoding=UTF-8

# Clippy: the workflow writes this report with cargo clippy
# --message-format=json; the analyzer imports it as external issues.
sonar.rust.clippyReport.reportPaths=build/clippy-report.json

# Coverage: the workflow's cargo llvm-cov run.
sonar.rust.lcov.reportPaths=build/lcov.info
