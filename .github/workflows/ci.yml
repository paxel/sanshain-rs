name: CI

# sanshain-rs's gates. The standard's part comes from paxel/gates: the OSV gate, the Rust gate
# (format, lint set, clippy, tests, coverage ratchet) and SonarQube Cloud. The job on the
# oldest supported Rust is the repository's own (docs/adr/0001-move-to-gates.md).
# A branch gets its run through its pull request; a run per push as well would be the same
# jobs twice, and SonarQube Cloud analyses only the default branch and pull requests.
on:
  push:
    branches: [summer]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Known vulnerabilities and licences of every dependency: osv-scanner decided by gates'
  # osv_gate.py. What is accepted stands in osv-scanner.toml.
  vulns:
    uses: paxel/gates/.github/workflows/vulns.yml@66ed2d3a448a5f6bfa1794809b330eb9fbee01ba # v1.2.0

  # On the Rust release rust-toolchain.toml pins. Linux only: the release ships source, as
  # crates, and no binary for any system.
  rust:
    uses: paxel/gates/.github/workflows/rust.yml@66ed2d3a448a5f6bfa1794809b330eb9fbee01ba # v1.2.0

  # The README promises this floor, so it is built and tested, not just declared.
  # Keep in sync with `rust-version` in the workspace Cargo.toml.
  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@599c45df1a24c1c63ae1129a7e59f46654b8fb66 # 1.89 branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Named explicitly: rust-toolchain.toml would otherwise pick the pinned release.
      - name: Tests
        run: cargo +1.89 test --workspace --locked

  sonar:
    needs: rust
    uses: paxel/gates/.github/workflows/sonar.yml@66ed2d3a448a5f6bfa1794809b330eb9fbee01ba # v1.2.0
    secrets:
      sonar-token: ${{ secrets.SQ_TOKEN }}
